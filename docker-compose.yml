services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jdr_dashboard
  mongo-express:
    image: mongo-express:1.0
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-change_me}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongodb

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    ports:
      - "5050:5050"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 5050
      MONGODB_URI: mongodb://mongodb:27017/jdr_dashboard
      TOKEN_KEY: ${TOKEN_KEY:-change_me_secret_key}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:-change_me_refresh_secret_key}
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    environment:
      # next dev lit process.env directement : plus besoin de baker ces
      # valeurs au build (cf. Dockerfile.frontend en prod). La CSP dev
      # (src/middleware.ts, branche NODE_ENV !== "production") autorise déjà
      # localhost:5050 automatiquement, donc EXTRA_CONNECT_SRC n'est plus
      # nécessaire ici.
      NEXT_PUBLIC_API_URL: http://localhost:5050
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5050
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
